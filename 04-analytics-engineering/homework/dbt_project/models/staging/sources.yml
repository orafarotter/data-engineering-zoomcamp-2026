version: 2

sources:
  - name: raw_data 
    description: "Raw data sources for NYC taxi rides"
    database: project-c547a08c-a25e-4ad3-bcf #Project ID
    schema: zoomcamp_dataset_ae #Dataset name
    tables:
      - name: green_tripdata
        description: Raw green taxi trip data
        columns:
          - name: vendorid
            description: |
              A code indicating the provider associated with the trip record.
              1: 'Creative Mobile Technologies'
              2: 'VeriFone Inc.'
              4: 'Unknown/Other'
            data_type: integer
            meta:
              pii: false
              ownership: data_team
              importance: high
              formatting: none
      - name: yellow_tripdata
        description: Raw yellow taxi trip data
      - name: fhv_tripdata
        description: Raw FHV (For-Hire Vehicle) trip data