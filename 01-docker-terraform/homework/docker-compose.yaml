services:
  #Postgres
  pgdatabase:
    image: postgres:18 
    container_name: pgdatabase
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=green_tripdata
    ports:
      - "5432:5432"
    volumes:
      - green_tripdata_pgs_data:/var/lib/postgresql

  #pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - "8085:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - pgdatabase

#Volumes
volumes:
  green_tripdata_pgs_data:
  pgadmin_data: